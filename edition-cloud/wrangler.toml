# =====================================================================
# UPCI ALERT — édition JavaScript portable • configuration Cloudflare
# =====================================================================
# Déploiement complet : voir INSTALL.md.
#   1) npx wrangler d1 create upci        → reporter l'id ci-dessous
#   2) npx wrangler d1 execute upci --remote --file=schema.sql
#   3) secrets (JAMAIS dans ce fichier) :
#        npx wrangler secret put UPCI_TELEGRAM_TOKEN
#        npx wrangler secret put UPCI_SESSION_SECRET
#      (les réglages métier — établissement, sites, Telegram, seuils,
#       mot de passe admin, clé de clôture — se saisissent ensuite
#       dans la page /installation et vivent dans la base D1)
#   4) npx wrangler deploy
# =====================================================================
name = "upci-alert"
main = "worker.js"
compatibility_date = "2025-01-01"

# Variables NON secrètes d'amorçage (toutes facultatives : la page
# /installation suffit à configurer le système).
[vars]
UPCI_ETABLISSEMENT = "EPSP — NOM DE L’ÉTABLISSEMENT"
UPCI_WILAYA = "Wilaya"

# Base D1 — le registre, le journal et les réglages vivent ici.
[[d1_databases]]
binding = "DB"
database_name = "upci"
database_id = "REMPLACER-PAR-L-ID-D1"

# Contrôles périodiques : relances, escalades, regroupements,
# silence hebdomadaire, bilan mensuel (voir src/cron.js).
[triggers]
crons = ["*/30 * * * *"]
